# gpt2api — 单容器部署 (SQLite + embed 前端)
# 无需 MySQL / Redis — 数据全部存储在 /app/data/gpt2api.db

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: gpt2api/server:latest
    container_name: gpt2api-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 强烈建议在 .env 中覆盖下列两项
      GPT2API_JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_in_production_please_32b}
      GPT2API_CRYPTO_AES_KEY: ${CRYPTO_AES_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GPT2API_APP_LISTEN: ":8080"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    dns:
      - ${DNS_PRIMARY:-8.8.8.8}
      - ${DNS_FALLBACK:-1.1.1.1}
    volumes:
      - ../configs:/app/configs:ro   # 挂载宿主配置(只读)
      - data:/app/data               # SQLite 数据文件持久化
      - ./logs:/app/logs             # 日志落盘

volumes:
  data:
