app:
  name: gpt2api
  env: dev              # dev | prod
  listen: ":8080"
  base_url: "http://localhost:8080"

log:
  level: info           # debug | info | warn | error
  format: console       # console | json
  output: stdout        # stdout | /var/log/gpt2api.log

# SQLite 数据库:单文件,无需额外服务
# 相对路径从工作目录解析;Docker 容器中建议使用 /app/data/gpt2api.db
sqlite:
  path: "data/gpt2api.db"

jwt:
  secret: "CHANGE_ME_TO_RANDOM_32_BYTES_SECRET"
  access_ttl_sec: 86400
  refresh_ttl_sec: 2592000
  issuer: "gpt2api"

crypto:
  # 32 字节 hex(64 字符),用于 AES-256-GCM 加密账号 AT / cookies
  aes_key: "CHANGE_ME_TO_64_HEX_CHARS_AES_256_KEY_000000000000000000000000"

security:
  bcrypt_cost: 10
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:5174"

# 账号池调度
scheduler:
  min_interval_sec: 60
  daily_usage_ratio: 0.6          # 单号日消耗熔断阈值
  lock_ttl_sec: 1200
  cooldown_429_sec: 600           # 连续 429 冷却
  warned_pause_hours: 24

# 上游 chatgpt.com
upstream:
  base_url: "https://chatgpt.com"
  request_timeout_sec: 60
  sse_read_timeout_sec: 300

smtp:
  host: ""
  port: 465
  username: ""
  password: ""
  from: ""
  from_name: "GPT2API"
  use_tls: true
